name: Update README TOC
on:
  push:
    paths:
      - 'chapters/**/*.ipynb'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate TOC
        run: |
          python3 -c "
          import os
          
          # 1. Gather all ipynb files from the 'chapters' directory
          # Change to your folder path if necessary
          folder_path = 'chapters'
          files = sorted([f for f in os.listdir(folder_path) if f.endswith('.ipynb')])
          
          # 2. Build the markdown table
          table = '| Chapter | Colab Link |\n| :--- | :--- |\n'
          for f in files:
              # Clean up filename for a readable title
              title = f.replace('.ipynb', '').replace('_', ' ')
              # Construct the Colab URL
              link = f'https://colab.research.google.com/github/fcisuez-2018/QC_Diego_E_Serrano/blob/main/{folder_path}/{f}'
              table += f'| {title} | [Open in Colab]({link}) |\n'
              
          # 3. Read existing README and inject table
          with open('README.md', 'r') as f:
              readme = f.read()
          
          start_tag = '## Table of Contents Start'
          end_tag = '## Table of Contents End'
          
          if start_tag in readme and end_tag in readme:
              before = readme.split(start_tag)[0]
              after = readme.split(end_tag)[1]
              new_readme = f'{before}{start_tag}\n{table}\n{end_tag}{after}'
              with open('README.md', 'w') as f:
                  f.write(new_readme)
          "
          
      - name: Commit and Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --quiet --staged; then
            git commit -m 'chore: update README table of contents'
            git pull --rebase origin main
            git push origin main
          fi
